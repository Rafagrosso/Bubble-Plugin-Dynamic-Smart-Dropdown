<!-- HEADER (cole no Shared HTML header) -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">

<style>
  .smart-dropdown * { box-sizing: border-box !important; }
  .smart-dropdown .select2-container { display: block !important; width: 100% !important; height: 100% !important; position: relative !important; }
  .smart-dropdown .select2-selection--single { display:flex !important; align-items:center !important; justify-content:flex-start !important; border:none !important; background:transparent !important; height:100% !important; padding:0 35px 0 10px !important; box-sizing:border-box !important; }
  .smart-dropdown .select2-selection__rendered { display:flex !important; align-items:center !important; justify-content:flex-start !important; width:100% !important; height:100% !important; padding:0 !important; margin:0 !important; text-align:left !important; }
  .smart-dropdown .select2-selection__arrow { position:absolute !important; right:10px !important; top:0 !important; bottom:0 !important; margin:auto 0 !important; height:12px !important; display:flex !important; align-items:center !important; pointer-events:none !important; }
  .select2-dropdown { z-index:999999 !important; border-radius:6px !important; box-shadow:0 2px 8px rgba(0,0,0,0.15) !important; overflow:hidden !important; }
  .smart-dropdown .select2-results__option { padding:8px 10px !important; text-align:left !important; }
  .smart-dropdown .select2-results__option--highlighted { background-color:var(--highlighted-color,#5897fb) !important; color:#fff !important; }
</style>

<script>
  (function(){
    // create a global promise to track Select2 readiness
    if (!window.__select2Ready) {
      window.__select2Ready = new Promise(function(resolve, reject){
        try {
          // already available
          if (window.jQuery && $.fn && $.fn.select2 && typeof $.fn.select2 === 'function') {
            console.log('[SD] select2 already present');
            resolve(true);
            return;
          }

          // load script with fallback and timeout
          var loaded = false;
          var script = document.createElement('script');
          script.src = "https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js";
          script.async = true;
          script.onload = function() {
            loaded = true;
            console.log('[SD] select2 loaded (onload)');
            resolve(true);
          };
          script.onerror = function() {
            console.error('[SD] select2 failed to load (onerror)');
            reject(new Error('select2 load error'));
          };
          document.head.appendChild(script);

          // timeout fallback
          setTimeout(function(){
            if (!loaded) {
              if (window.jQuery && $.fn && $.fn.select2 && typeof $.fn.select2 === 'function') {
                console.log('[SD] select2 available after timeout check');
                resolve(true);
              } else {
                console.warn('[SD] select2 not available after timeout');
                reject(new Error('select2 timeout'));
              }
            }
          }, 4000);
        } catch(err) { reject(err); }
      });
    }
  })();
</script>

<script src="https://ajax.googleapis.com/ajax/libs/webfont/1/webfont.js"></script>
