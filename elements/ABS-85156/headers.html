<!-- SmartDropdown — estilos premium compartilhados (sem dependências externas).
     Este mesmo bloco é usado nos headers dos elementos Dynamic Dropdown e
     Headless Dropdown.
     Todas as cores chegam como variáveis já calculadas em JS (rgb/rgba
     concretos). Nada de color-mix() aqui: um valor inválido vindo de um
     campo de cor vazio do Bubble invalidaria a declaração inteira e a cor
     simplesmente sumiria. Cada var tem um fallback sólido, então o visual
     continua correto mesmo se o JS não tiver rodado ainda. -->
<style>
  /* host / control ------------------------------------------------------ */
  .sdd-host { overflow: visible !important; }
  .sdd-root { position: relative; width: 100%; height: 100%; box-sizing: border-box; font-family: inherit; font-size: inherit; color: inherit; }
  .sdd-root * { box-sizing: border-box; }

  .sdd-control {
    width: 100%; height: 100%;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    cursor: pointer; user-select: none;
    background: transparent; border: none; outline: none;
    border-radius: inherit;
    transition: box-shadow .15s ease;
  }
  .sdd-root.sdd-focused .sdd-control {
    border-radius: 8px;
    box-shadow: 0 0 0 3px var(--sdd-ring, rgba(99,102,241,.22));
  }

  .sdd-value-wrap { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; }
  .sdd-placeholder { color: var(--sdd-ph, #94a3b8); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sdd-single-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* chips (multiple selection) — translucent accent so they read correctly
     over any element background the user sets in Bubble ------------------ */
  .sdd-tags { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
  .sdd-tag {
    display: inline-flex; align-items: center; gap: 4px;
    flex: 0 1 auto; min-width: 58px; max-width: 150px;
    padding: 3px 6px 3px 10px;
    border-radius: 8px;
    background: var(--sdd-chip-bg, rgba(99,102,241,.14));
    border: 1px solid var(--sdd-chip-border, rgba(99,102,241,.28));
    color: var(--sdd-chip-color, #4338ca);
    font-size: .85em; line-height: 1.25; white-space: nowrap;
  }
  .sdd-tag-label { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sdd-tag-x {
    flex: 0 0 auto;
    border: none; background: transparent; color: inherit;
    cursor: pointer; font-size: 1em; line-height: 1; padding: 1px 3px; border-radius: 4px;
    opacity: .75; transition: opacity .12s ease, background .12s ease;
  }
  .sdd-tag-x:hover { opacity: 1; background: var(--sdd-chip-border, rgba(99,102,241,.28)); }
  /* the "+N" pill must never be clipped, however tight the control gets */
  .sdd-tag-count {
    flex: 0 0 auto; min-width: 0;
    padding: 3px 8px;
    background: var(--sdd-neutral-bg, rgba(100,116,139,.14));
    border-color: transparent;
    color: var(--sdd-neutral-color, #475569);
  }

  /* clear + arrow -------------------------------------------------------- */
  .sdd-clear {
    display: none; flex: 0 0 auto;
    border: none; background: transparent;
    width: 22px; height: 22px; border-radius: 50%;
    color: var(--sdd-ctl-muted, #94a3b8); cursor: pointer; padding: 0;
    align-items: center; justify-content: center;
    transition: background .12s ease, color .12s ease;
  }
  .sdd-root.sdd-has-value .sdd-clear { display: inline-flex; }
  .sdd-clear:hover { background: var(--sdd-neutral-bg, rgba(100,116,139,.14)); color: var(--sdd-ctl-strong, #475569); }
  .sdd-arrow { flex: 0 0 auto; display: inline-flex; color: var(--sdd-ctl-muted, #64748b); transition: transform .18s ease; pointer-events: none; }
  .sdd-root.sdd-focused .sdd-arrow { transform: rotate(180deg); }
  .sdd-root.sdd-disabled .sdd-control { cursor: not-allowed; opacity: .55; box-shadow: none; }

  /* popup ---------------------------------------------------------------- */
  .sdd-popup {
    position: fixed; z-index: 2147483000;
    display: none; flex-direction: column;
    background: var(--sdd-pop-bg, #ffffff);
    border: 1px solid var(--sdd-pop-border, rgba(15,23,42,.10));
    border-radius: 14px;
    box-shadow: 0 4px 6px -2px rgba(15,23,42,.06), 0 18px 44px -10px rgba(15,23,42,.22);
    overflow: hidden;
    font-family: inherit;
    color: var(--sdd-opt-color, #1e293b);
  }
  .sdd-popup.sdd-open { display: flex; }
  .sdd-popup, .sdd-popup * { box-sizing: border-box; }

  /* search fixed at the top of the popup --------------------------------- */
  .sdd-search-wrap {
    flex: 0 0 auto;
    padding: 10px;
    background: var(--sdd-pop-bg, #fff);
    border-bottom: 1px solid var(--sdd-pop-border, rgba(15,23,42,.08));
  }
  .sdd-search-box { position: relative; }
  .sdd-search-box .sdd-search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--sdd-s-ph, #94a3b8); display: inline-flex; pointer-events: none;
  }
  .sdd-search {
    width: 100%;
    height: var(--sdd-s-h, 38px);
    padding: 0 12px 0 34px;
    border-radius: var(--sdd-s-r, 10px);
    border: 1px solid var(--sdd-s-border, #e2e8f0);
    background: var(--sdd-s-bg, #f8fafc);
    color: var(--sdd-s-color, #0f172a);
    font-family: inherit; font-size: inherit; outline: none;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .sdd-popup.sdd-no-icon .sdd-search { padding-left: 12px; }
  .sdd-popup.sdd-no-icon .sdd-search-icon { display: none; }
  .sdd-search::placeholder { color: var(--sdd-s-ph, #94a3b8); }
  .sdd-search:focus {
    border-color: var(--sdd-accent, #6366f1);
    box-shadow: 0 0 0 3px var(--sdd-ring, rgba(99,102,241,.22));
  }

  /* list ------------------------------------------------------------------ */
  .sdd-list { flex: 1 1 auto; overflow-y: auto; padding: 6px; overscroll-behavior: contain; }
  .sdd-list::-webkit-scrollbar { width: 8px; }
  .sdd-list::-webkit-scrollbar-thumb { background: var(--sdd-scroll, #cbd5e1); border-radius: 8px; border: 2px solid var(--sdd-pop-bg, #fff); }
  .sdd-list::-webkit-scrollbar-track { background: transparent; }

  .sdd-group-header {
    padding: 10px 10px 4px;
    font-size: .72em; font-weight: 600;
    text-transform: uppercase; letter-spacing: .07em;
    color: var(--sdd-muted, #94a3b8);
  }
  .sdd-group + .sdd-group { margin-top: 4px; }

  .sdd-option {
    display: flex; align-items: center; gap: 10px;
    padding: var(--sdd-opt-pv, 9px) 10px; border-radius: 9px;
    cursor: pointer; color: var(--sdd-opt-color, #1e293b);
    transition: background .1s ease, color .1s ease;
  }
  .sdd-option:hover, .sdd-option.sdd-focus { background: var(--sdd-hover-bg, #f1f5f9); }
  .sdd-option.sdd-selected {
    background: var(--sdd-sel-bg, #eef2ff);
    color: var(--sdd-sel-color, #4338ca);
    font-weight: 500;
    box-shadow: inset 0 0 0 1px var(--sdd-sel-ring, rgba(99,102,241,.22));
  }
  .sdd-option.sdd-selected:hover, .sdd-option.sdd-selected.sdd-focus { background: var(--sdd-sel-bg-hover, #e0e7ff); }
  .sdd-option-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sdd-tick { color: var(--sdd-accent, #6366f1); display: inline-flex; flex: 0 0 auto; }

  /* checkbox (multiple mode) --------------------------------------------- */
  .sdd-check {
    flex: 0 0 18px; width: 18px; height: 18px;
    border-radius: 6px;
    border: 1.5px solid var(--sdd-check-border, #cbd5e1);
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--sdd-check-mark, #fff);
    transition: background .12s ease, border-color .12s ease;
  }
  .sdd-check svg { opacity: 0; transform: scale(.6); transition: opacity .12s ease, transform .12s ease; }
  .sdd-option.sdd-selected .sdd-check { background: var(--sdd-accent, #6366f1); border-color: var(--sdd-accent, #6366f1); }
  .sdd-option.sdd-selected .sdd-check svg { opacity: 1; transform: scale(1); }

  .sdd-empty { padding: 22px 12px; text-align: center; color: var(--sdd-muted, #94a3b8); }

  /* animations (duration set inline via animation-duration) --------------- */
  .sdd-anim-fade  { animation-name: sddFade;  animation-timing-function: cubic-bezier(.16,1,.3,1); animation-fill-mode: both; }
  .sdd-anim-slide { animation-name: sddSlide; animation-timing-function: cubic-bezier(.16,1,.3,1); animation-fill-mode: both; transform-origin: top center; }
  .sdd-anim-zoom  { animation-name: sddZoom;  animation-timing-function: cubic-bezier(.16,1,.3,1); animation-fill-mode: both; transform-origin: top center; }
  .sdd-popup.sdd-up.sdd-anim-slide { animation-name: sddSlideUp; transform-origin: bottom center; }
  .sdd-popup.sdd-up.sdd-anim-zoom  { transform-origin: bottom center; }
  @keyframes sddFade    { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sddSlide   { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes sddSlideUp { from { opacity: 0; transform: translateY(8px); }  to { opacity: 1; transform: translateY(0); } }
  @keyframes sddZoom    { from { opacity: 0; transform: scale(.96); }       to { opacity: 1; transform: scale(1); } }

  @media (max-width: 480px) {
    .sdd-popup { border-radius: 12px; }
    .sdd-option { padding: max(var(--sdd-opt-pv, 9px), 11px) 10px; }
  }
</style>
