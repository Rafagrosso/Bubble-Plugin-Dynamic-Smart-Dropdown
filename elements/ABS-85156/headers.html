<style>
/* == Smart native dropdown — fresh start == */
.sd-root { box-sizing: border-box; position: relative; width:100%; height:100%; font-family: inherit; font-size: inherit; color: inherit; }

/* control (visible element) */
.sd-control {
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 12px; box-sizing:border-box;
  cursor:pointer; user-select:none;
  background: transparent;
  border: none;
}

/* value text left */
.sd-value {
  flex:1 1 auto;
  text-align:left;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* clear X (left, red) */
.sd-clear {
  display:none;
  position:absolute; left:8px;
  top:50%; transform:translateY(-50%);
  width:18px; height:18px; border-radius:50%;
  background:#d9534f; color:white; font-size:12px; line-height:18px;
  align-items:center; justify-content:center;
  cursor:pointer;
}

/* show when value present */
.sd-has-value .sd-clear { display:flex; }

/* arrow right */
.sd-arrow {
  flex:0 0 24px; height:24px; display:flex; align-items:center; justify-content:center;
  margin-left:8px;
  pointer-events:none;
}

/* popup */
.sd-popup {
  position:absolute; left:0; right:0; z-index:999999;
  background:#fff; border:1px solid #d0d0d0; border-radius:6px;
  box-shadow:0 6px 18px rgba(0,0,0,0.12);
  margin-top:6px;
  box-sizing:border-box;
  max-height:320px; display:none; flex-direction:column; overflow:hidden;
}

/* popup open */
.sd-popup.open { display:flex; }

/* popup upward variant */
.sd-popup.up { margin-top:0; bottom:calc(100% + 6px); top:auto; }

/* search inside popup */
.sd-search-wrap { padding:8px; background:#f6f6f6; box-sizing:border-box; }
.sd-search { width:100%; padding:6px 8px; height:34px; box-sizing:border-box; border-radius:4px; border:1px solid #ccc; }

/* list */
.sd-list { overflow:auto; -webkit-overflow-scrolling:touch; }
.sd-option { padding:8px 12px; cursor:pointer; min-height:36px; display:flex; align-items:center; box-sizing:border-box; }
.sd-option:hover, .sd-option.highlight { background:#5897fb; color:#fff; }

/* animation classes (simple) */
.sd-anim-fade { animation:sdFade .18s ease-out; }
.sd-anim-slide { animation:sdSlide .22s ease-out; transform-origin:top center; }
.sd-anim-zoom { animation:sdZoom .18s ease-out; transform-origin:top center; }
@keyframes sdFade { from{opacity:0} to{opacity:1} }
@keyframes sdSlide { from{transform:translateY(-6px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes sdZoom { from{transform:scale(.98);opacity:0} to{transform:scale(1);opacity:1} }

/* ensure control uses bubble provided sizing */
.sd-root, .sd-root * { font-family: inherit; font-size: inherit; color: inherit; }
</style>
